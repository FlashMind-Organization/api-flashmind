[project]
name = "api-flashmind"
version = "0.1.0"
description = "Backend em Django REST Framework para o ecossistema FlashMind"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15,<3.16",
    "djangorestframework-simplejwt>=5.3,<5.4",
    "django-cors-headers>=4.4,<4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9,<4.10",
]
